name: 每日爬取政府標案

on:
  schedule:
    # 每日 01:00 UTC（台灣時間 09:00）執行
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "指定公告日期 YYYY-MM-DD（留空＝今日）"
        required: false
        default: ""
      days:
        description: "往前抓幾天"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: 執行每日爬取
        run: |
          python -m scraper.run_daily \
            ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }} \
            --days ${{ github.event.inputs.days || '1' }}

      - name: 關鍵字訂閱 Email 通知
        if: ${{ env.SMTP_HOST != '' }}
        run: python -m scraper.notify ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
        continue-on-error: true

      - name: 提交當日標案資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --staged --quiet; then
            echo "本次無新資料變更。"
          else
            git commit -m "data: 每日標案爬取 $(date -u +%Y-%m-%d)"
            git push
          fi
